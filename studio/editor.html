<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor · Runthru</title>
<link rel="icon" href="/studio/favicon.svg">
<link rel="stylesheet" href="/studio/studio.css">
<link rel="stylesheet" href="/player/player.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  .work { flex: 1; display: grid; grid-template-columns: 190px minmax(0,1fr) 340px; min-height: 0; }

  /* ---- filmstrip ---- */
  .strip { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px; }
  .strip__head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); padding: 4px 4px 10px;
  }
  .shot {
    position: relative; border-radius: 8px; overflow: hidden; margin-bottom: 8px;
    border: 2px solid transparent; cursor: pointer; background: var(--panel2);
  }
  .shot:hover { border-color: var(--line-strong); }
  .shot--on { border-color: var(--accent); }
  .shot--drag { opacity: .35; }
  .shot img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; }
  .shot__n {
    position: absolute; top: 5px; left: 5px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 5px; background: rgba(8,8,12,.85); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .shot__k { position: absolute; top: 5px; right: 5px; font-size: 10px; padding: 2px 6px;
             border-radius: 999px; background: rgba(8,8,12,.85); color: var(--muted); }
  .shot__x {
    position: absolute; top: 5px; right: 5px; width: 19px; height: 19px; padding: 0;
    border: 0; border-radius: 5px; background: rgba(8,8,12,.85); color: var(--muted);
    font-size: 14px; line-height: 1; cursor: pointer; display: none;
    align-items: center; justify-content: center;
  }
  .shot__x:hover { background: var(--bad); color: #fff; }
  /* The delete button takes the kind chip's corner while the pointer is over the card. */
  .shot:hover .shot__x { display: flex; }
  .shot:hover .shot__k { display: none; }
  .shot__t {
    padding: 6px 7px; font-size: 11.5px; line-height: 1.35; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .shot--on .shot__t { color: var(--fg); }

  /* ---- canvas ---- */
  .canvas {
    background: #060608; overflow: auto; padding: 28px;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .canvas__inner { width: 100%; max-width: 1100px; }
  #preview { box-shadow: 0 24px 70px rgba(0,0,0,.55); }

  /* ---- inspector ---- */
  .insp { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .insp__tabs { display: flex; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .insp__tab {
    flex: 1; appearance: none; border: 0; background: transparent; cursor: pointer;
    padding: 11px 6px; font-size: 12.5px; font-weight: 650; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .insp__tab:hover { color: var(--fg); }
  .insp__tab--on { color: var(--fg); border-bottom-color: var(--fg); }
  .insp__body { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
  .insp__body[hidden] { display: none; }

  .group { border-top: 1px solid var(--line); margin: 16px -16px 0; padding: 15px 16px 0; }
  .group:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .group > h4 {
    margin: 0 0 11px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted);
  }

  .withai { position: relative; }
  .withai .aibtns { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .aichip {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .aichip:hover { border-color: var(--accent); color: var(--accent); }
  .aichip:disabled { opacity: .4; cursor: default; }

  .seg { display: flex; gap: 3px; background: var(--bg); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
  .seg button {
    flex: 1; appearance: none; border: 0; background: transparent; color: var(--muted);
    padding: 6px 4px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .seg button:hover { color: var(--fg); }
  .seg button.on { background: var(--accent); color: #fff; }

  .listrow {
    display: flex; gap: 6px; align-items: center; margin-bottom: 6px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px;
  }
  .listrow .input { border: 0; background: transparent; padding: 2px 4px; font-size: 12.5px; }
  .listrow .x {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; padding: 2px 5px; font-size: 15px; line-height: 1; border-radius: 5px;
  }
  .listrow .x:hover { color: var(--bad); background: var(--panel2); }

  /* ---- ai chat ---- */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .chat__log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; padding-bottom: 12px; }
  .msg { font-size: 13px; line-height: 1.55; }
  .msg--user { align-self: flex-end; max-width: 88%; background: var(--accent); color: #fff;
               padding: 8px 12px; border-radius: 12px 12px 3px 12px; }
  .msg--ai { color: var(--fg); white-space: pre-wrap; }
  .msg--sys { color: var(--muted); font-size: 12px; font-style: italic; }
  .msg__ops { margin-top: 7px; display: flex; flex-direction: column; gap: 3px; }
  .msg__op {
    font-size: 11.5px; color: var(--good); background: rgba(52,211,153,.09);
    border: 1px solid rgba(52,211,153,.22); border-radius: 6px; padding: 4px 8px;
  }
  .chat__form { flex: 0 0 auto; border-top: 1px solid var(--line); padding-top: 12px; }
  .chat__ideas { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 9px; }

  .thinking::after {
    content: '···'; display: inline-block; animation: dots 1.2s steps(4) infinite; color: var(--muted);
  }
  @keyframes dots { 0% { content: '·' } 33% { content: '··' } 66% { content: '···' } }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">
    <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
      <path class="brand__frame" d="M13 4.25H7A2.75 2.75 0 0 0 4.25 7v10A2.75 2.75 0 0 0 7 19.75h6"/>
      <path class="brand__frame" d="M16.4 4.25H17A2.75 2.75 0 0 1 19.75 7v2"/>
      <path class="brand__frame" d="M19.75 15v2A2.75 2.75 0 0 1 17 19.75h-.6"/>
      <path class="brand__play" d="M10.9 7.9 20.5 12l-9.6 4.1z"/>
    </svg>
    <span class="brand__name"><b>Run</b><span>thru</span></span>
  </a>
  <span class="crumb" id="crumb"></span>
  <span class="sep"></span>
  <button class="btn btn--sm" id="undoBtn" title="Undo (⌘Z)">Undo</button>
  <button class="btn btn--sm" id="redoBtn" title="Redo (⇧⌘Z)">Redo</button>
  <button class="btn btn--sm" id="prepBtn" title="Open the recording browser without recording — sign in and set the app up first">⚑ Prep</button>
  <button class="btn btn--sm" id="recordBtn">● Record</button>
  <button class="btn btn--sm" id="aiRecordBtn" title="AI signs in, follows your scenario and records the tutorial itself">✦ AI Record</button>
  <button class="btn btn--sm" id="reRecordBtn" title="Throw away these steps and have AI record the demo again from its description">↻ Re-record</button>
  <a class="btn btn--sm" id="playBtn" target="_blank">Preview</a>
  <button class="btn btn--sm btn--primary" id="exportBtn">Export</button>
</div>

<div class="work">
  <aside class="strip">
    <div class="strip__head"><span>Steps</span><span id="stepCount"></span></div>
    <div id="strip"></div>
  </aside>

  <main class="canvas">
    <div class="canvas__inner"><div id="preview"></div></div>
  </main>

  <aside class="insp">
    <div class="insp__tabs">
      <button class="insp__tab insp__tab--on" data-pane="step">Step</button>
      <button class="insp__tab" data-pane="demo">Demo</button>
      <button class="insp__tab" data-pane="ai">AI</button>
    </div>
    <div class="insp__body" id="paneStep"></div>
    <div class="insp__body" id="paneDemo" hidden></div>
    <div class="insp__body" id="paneAi" hidden></div>
  </aside>
</div>

<script type="module" src="/studio/editor.js"></script>
</body>
</html>
