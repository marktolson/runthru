<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase · Runthru</title>
<link rel="icon" href="/studio/favicon.svg">
<link rel="stylesheet" href="/studio/studio.css">
<link rel="stylesheet" href="/player/player.css">
<link rel="stylesheet" href="/player/showcase.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  .work { flex: 1; display: grid; grid-template-columns: 300px minmax(0,1fr); min-height: 0; }
  .side { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; }
  .stagewrap { overflow: auto; padding: 32px; background: #08080b; }
  .stagewrap .surface {
    background: #fff; border-radius: 14px; padding: 32px; max-width: 1180px; margin: 0 auto;
  }
  .stagewrap .surface.dark { background: #0b0b0f; }

  .feat {
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    padding: 11px; margin-bottom: 9px;
  }
  .feat__top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .feat__top .n { font-size: 11px; font-weight: 700; color: var(--muted); }
  .feat__top .sp { flex: 1; }
  .feat .x, .feat .mv {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; padding: 2px 5px; border-radius: 5px; font-size: 13px; line-height: 1;
  }
  .feat .x:hover { color: var(--bad); background: var(--panel2); }
  .feat .mv:hover { color: var(--fg); background: var(--panel2); }
  .group { border-top: 1px solid var(--line); margin: 16px -16px 0; padding: 15px 16px 0; }
  .group:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .group > h4 { margin: 0 0 11px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
                text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">
    <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
      <path class="brand__frame" d="M13 4.25H7A2.75 2.75 0 0 0 4.25 7v10A2.75 2.75 0 0 0 7 19.75h6"/>
      <path class="brand__frame" d="M16.4 4.25H17A2.75 2.75 0 0 1 19.75 7v2"/>
      <path class="brand__frame" d="M19.75 15v2A2.75 2.75 0 0 1 17 19.75h-.6"/>
      <path class="brand__play" d="M10.9 7.9 20.5 12l-9.6 4.1z"/>
    </svg>
    <span class="brand__name"><b>Run</b><span>thru</span></span>
  </a>
  <span class="crumb" id="crumb"></span>
  <span class="sep"></span>
  <button class="btn btn--sm" id="refreshBtn">Refresh preview</button>
  <button class="btn btn--sm btn--primary" id="exportBtn">Export &amp; embed</button>
</div>

<div class="work">
  <aside class="side" id="side"></aside>
  <main class="stagewrap"><div class="surface" id="surface"><div id="preview"></div></div></main>
</div>

<script type="module">
import { FeatureShowcase } from '/player/showcase.js';
import { api, toast, modal, esc, debounce } from '/studio/util.js';

const slug = new URLSearchParams(location.search).get('s');
if (!slug) location.href = '/';

let doc = null;
let demos = [];
let widget = null;

async function load() {
  [doc, demos] = await Promise.all([
    api(`/api/showcases/${slug}`).then((r) => r.doc),
    api('/api/demos'),
  ]);
  // Posters point at a specific step file, which goes stale the moment that step is deleted
  // or reordered in the demo editor. Re-derive them on load so the builder is self-healing.
  let changed = false;
  for (const f of doc.features || []) {
    if (!f.demoSlug) continue;
    const shot = await firstShot(f.demoSlug);
    if (shot !== f.poster) {
      f.poster = shot;
      changed = true;
    }
  }
  if (changed) await saveNow();
  render();
}

const save = debounce(async () => {
  doc = await api(`/api/showcases/${slug}`, { method: 'PUT', body: { doc } }).then((r) => r.doc);
}, 400);

function saveNow() {
  return api(`/api/showcases/${slug}`, { method: 'PUT', body: { doc } }).then((r) => (doc = r.doc));
}

function render() {
  document.getElementById('crumb').innerHTML = `<strong>${esc(doc.name)}</strong>`;
  renderSide();
  renderPreview();
}

function renderSide() {
  const t = doc.theme || {};
  const s = doc.settings || {};
  document.getElementById('side').innerHTML = `
    <div class="group">
      <h4>Showcase</h4>
      <div class="field"><label>Name</label><input class="input" id="sName" value="${esc(doc.name)}"></div>
      <div class="field"><label>Description</label><input class="input" id="sDesc" value="${esc(doc.description || '')}"></div>
    </div>

    <div class="group">
      <h4>Features</h4>
      <div class="hint" style="margin-bottom:9px">Each becomes an entry in the list. Viewers click a name, or simply scroll, to move between them.</div>
      <div id="feats">
        ${(doc.features || []).map(featHtml).join('') || '<div class="hint">No features yet.</div>'}
      </div>
      <button class="btn btn--sm" id="addFeat">+ Add feature</button>
    </div>

    <div class="group">
      <h4>Look</h4>
      <div class="row">
        <div class="field" style="flex:0 0 66px"><label>Accent</label>
          <input class="input" type="color" id="tAccent" value="${esc(t.accent || '#5b5bd6')}" style="padding:3px;height:36px"></div>
        <div class="field" style="flex:1"><label>Layout</label>
          <select class="input" id="tLayout">
            <option value="rail" ${t.layout === 'rail' ? 'selected' : ''}>Side rail</option>
            <option value="tabs" ${t.layout === 'tabs' ? 'selected' : ''}>Tabs across the top</option>
          </select></div>
      </div>
      <label class="check"><input type="checkbox" id="tDark" ${t.dark ? 'checked' : ''}> Dark surface</label>
      <label class="check"><input type="checkbox" id="sNums" ${s.showFeatureNumbers !== false ? 'checked' : ''}> Number the features</label>
      <label class="check"><input type="checkbox" id="sComm" ${s.showCommentary !== false ? 'checked' : ''}> Show commentary</label>
      <label class="check"><input type="checkbox" id="sScroll" ${s.advanceOnScroll !== false ? 'checked' : ''}> Follow scrolling</label>
    </div>

    <div class="group">
      <h4>Closing action</h4>
      <div class="field"><label>Button label</label><input class="input" id="cLabel" value="${esc(s.ctaLabel || '')}" placeholder="Book a demo"></div>
      <div class="field"><label>Link</label><input class="input" id="cHref" value="${esc(s.ctaHref || '')}" placeholder="https://"></div>
    </div>`;

  wireSide();
}

function featHtml(f, i) {
  return `<div class="feat" data-f="${i}">
    <div class="feat__top">
      <span class="n">${String(i + 1).padStart(2, '0')}</span>
      <span class="sp"></span>
      <button class="mv" data-up="${i}" title="Move up">↑</button>
      <button class="mv" data-down="${i}" title="Move down">↓</button>
      <button class="x" data-del="${i}" title="Remove">×</button>
    </div>
    <div class="field"><label>Name</label><input class="input" data-k="name" data-i="${i}" value="${esc(f.name)}"></div>
    <div class="field"><label>Tagline</label><input class="input" data-k="tagline" data-i="${i}" value="${esc(f.tagline || '')}" placeholder="One line under the title"></div>
    <div class="field"><label>Demo</label>
      <select class="input" data-k="demoSlug" data-i="${i}">
        <option value="">— none —</option>
        ${demos.map((d) => `<option value="${esc(d.slug)}" ${f.demoSlug === d.slug ? 'selected' : ''}>${esc(d.name)} (${d.steps})</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Commentary</label>
      <textarea class="input" data-k="commentary" data-i="${i}" rows="3" placeholder="Explain what the viewer is looking at and why it matters.">${esc(f.commentary || '')}</textarea>
    </div>
  </div>`;
}

function wireSide() {
  const side = document.getElementById('side');
  const $ = (id) => side.querySelector(id);

  $('#sName').oninput = (e) => { doc.name = e.target.value; save(); };
  $('#sDesc').oninput = (e) => { doc.description = e.target.value; save(); };

  $('#tAccent').onchange = (e) => { doc.theme.accent = e.target.value; save(); renderPreview(); };
  $('#tLayout').onchange = (e) => { doc.theme.layout = e.target.value; save(); renderPreview(); };
  $('#tDark').onchange = (e) => { doc.theme.dark = e.target.checked; save(); renderPreview(); };
  $('#sNums').onchange = (e) => { doc.settings.showFeatureNumbers = e.target.checked; save(); renderPreview(); };
  $('#sComm').onchange = (e) => { doc.settings.showCommentary = e.target.checked; save(); renderPreview(); };
  $('#sScroll').onchange = (e) => { doc.settings.advanceOnScroll = e.target.checked; save(); renderPreview(); };
  $('#cLabel').oninput = (e) => { doc.settings.ctaLabel = e.target.value; save(); };
  $('#cHref').oninput = (e) => { doc.settings.ctaHref = e.target.value; save(); };

  $('#addFeat').onclick = async () => {
    const d = demos[0];
    const poster = d ? await firstShot(d.slug) : '';
    let max = 0;
    for (const f of doc.features) {
      const m = /^f(\d+)$/.exec(f.id || '');
      if (m) max = Math.max(max, Number(m[1]));
    }
    doc.features.push({
      id: `f${max + 1}`,
      name: d ? d.name : 'New feature',
      tagline: '',
      commentary: '',
      media: 'demo',
      demoSlug: d ? d.slug : '',
      poster,
    });
    await saveNow();
    render();
  };

  side.querySelectorAll('[data-k]').forEach((el) => {
    el.oninput = async () => {
      const f = doc.features[Number(el.dataset.i)];
      f[el.dataset.k] = el.value;
      // Point the poster at whichever step is actually first — not a guessed filename, which
      // goes stale as soon as steps are deleted or reordered.
      if (el.dataset.k === 'demoSlug') {
        f.poster = el.value ? await firstShot(el.value) : '';
        save();
        return renderPreview();
      }
      save();
      if (el.dataset.k !== 'commentary') renderPreview();
    };
  });

  side.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      doc.features.splice(Number(b.dataset.del), 1);
      await saveNow();
      render();
    };
  });
  const move = async (from, to) => {
    if (to < 0 || to >= doc.features.length) return;
    const [f] = doc.features.splice(from, 1);
    doc.features.splice(to, 0, f);
    await saveNow();
    render();
  };
  side.querySelectorAll('[data-up]').forEach((b) => (b.onclick = () => move(Number(b.dataset.up), Number(b.dataset.up) - 1)));
  side.querySelectorAll('[data-down]').forEach((b) => (b.onclick = () => move(Number(b.dataset.down), Number(b.dataset.down) + 1)));
}

// The first step's screenshot, whatever it happens to be called.
async function firstShot(demoSlug) {
  try {
    const d = await api(`/api/demos/${demoSlug}`).then((r) => r.doc);
    const shot = d.nodes.find((n) => n.shot)?.shot;
    return shot ? `demos/${demoSlug}/${shot}` : '';
  } catch {
    return '';
  }
}

function renderPreview() {
  widget?.destroy();
  const host = document.getElementById('preview');
  host.className = '';
  host.innerHTML = '';
  document.getElementById('surface').classList.toggle('dark', !!doc.theme?.dark);
  // The studio serves demo bundles from /demos, which is the same shape the export uses.
  widget = new FeatureShowcase(host, { doc, base: '' });
  widget.resolve = (p) => (p ? `/${p}` : p);
  widget.mount();
}

document.getElementById('refreshBtn').onclick = renderPreview;

document.getElementById('exportBtn').onclick = () => {
  modal({
    title: 'Export showcase',
    body: `<p>Bundles the widget and every demo it references into one folder, plus a one-line script tag for your site.</p>
      <div class="field"><label>Public URL (optional)</label>
      <input class="input" id="xUrl" placeholder="https://demos.yoursite.com/showcase-${esc(slug)}"></div>`,
    confirm: 'Export',
    onConfirm: async (root, close) => {
      await saveNow();
      const r = await api(`/api/showcases/${slug}/export`, { method: 'POST', body: { publicUrl: root.querySelector('#xUrl').value.trim() } });
      close();
      modal({
        title: 'Exported',
        body: `<p>${r.features} features · ${r.demos.length} demo bundle${r.demos.length === 1 ? '' : 's'}${r.zipBytes ? ` · zipped to ${(r.zipBytes / 1024 / 1024).toFixed(1)} MB` : ''}</p>
          ${
            r.zipUrl
              ? `<p><a class="btn btn--primary" href="${esc(r.zipUrl)}" download style="display:inline-block;text-decoration:none">⤓ Download showcase-${esc(slug)}.zip</a></p>`
              : ''
          }
          <div class="field"><label>Written to</label><input class="input" value="${esc(r.dir)}" readonly onclick="this.select()"></div>
          <div class="field"><label>Embed snippet</label>
          <textarea class="input" rows="5" readonly onclick="this.select()">&lt;div id="feature-showcase"&gt;&lt;/div&gt;
&lt;script src="YOUR-HOST/embed.js"
        data-showcase="YOUR-HOST/showcase.json"
        data-target="#feature-showcase" defer&gt;&lt;/script&gt;</textarea></div>
          <p class="hint">Full instructions are in <code>embed.txt</code> inside the folder. Preview with <code>npm run serve-export -- showcase-${esc(slug)}</code>.</p>`,
        confirm: 'Done',
        cancel: 'Close',
      });
    },
  });
};

await load();
</script>
</body>
</html>
