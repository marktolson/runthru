<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runthru</title>
<link rel="icon" href="/studio/favicon.svg">
<link rel="stylesheet" href="/studio/studio.css">
<style>
  .page { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .head h1 { margin: 0 0 5px; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  .head p { margin: 0; color: var(--muted); font-size: 13.5px; }

  .tabs { display: flex; gap: 2px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
  .tab {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    padding: 9px 14px; font-size: 13px; font-weight: 550; color: var(--muted);
    border-bottom: 1.5px solid transparent; margin-bottom: -1px;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--fg); }
  .tab--on { color: var(--fg); border-bottom-color: var(--fg); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
  }
  .card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-2); }
  .card__thumb {
    aspect-ratio: 16/10; background: var(--panel2); position: relative;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .card__thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .card__thumb .none { color: var(--muted); font-size: 12px; }
  .card__badge {
    position: absolute; top: 9px; right: 9px; padding: 3px 9px; border-radius: 999px;
    background: rgba(8, 8, 11, 0.78); backdrop-filter: blur(6px);
    font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
  }
  .card__body { padding: 13px 15px 11px; flex: 1; }
  .card__body h3 { margin: 0 0 3px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .card__body .meta {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card__foot { display: flex; gap: 6px; padding: 0 12px 12px; }
  .card__foot .btn { flex: 1; text-align: center; text-decoration: none; }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">
    <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
      <path class="brand__frame" d="M13 4.25H7A2.75 2.75 0 0 0 4.25 7v10A2.75 2.75 0 0 0 7 19.75h6"/>
      <path class="brand__frame" d="M16.4 4.25H17A2.75 2.75 0 0 1 19.75 7v2"/>
      <path class="brand__frame" d="M19.75 15v2A2.75 2.75 0 0 1 17 19.75h-.6"/>
      <path class="brand__play" d="M10.9 7.9 20.5 12l-9.6 4.1z"/>
    </svg>
    <span class="brand__name"><b>Run</b><span>thru</span></span>
  </a>
  <span class="sep"></span>
  <span class="crumb" id="aiStatus"></span>
</div>

<div class="page">
  <div class="head">
    <div>
      <h1>Your library</h1>
      <p>Record a runthru of any web app, edit the story by hand or with AI, then export it anywhere.</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="aiNewBtn" title="Describe a scenario — AI signs in, runs it and records the demo">✦ AI Record</button>
      <button class="btn btn--primary" id="newBtn">+ New</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab tab--on" data-tab="demos">Demos</button>
    <button class="tab" data-tab="showcases">Feature showcases</button>
  </div>

  <div id="list"></div>
</div>

<script type="module">
import { api, toast, modal, esc } from '/studio/util.js';

let tab = 'demos';

async function render() {
  const list = document.getElementById('list');
  if (tab === 'demos') {
    const demos = await api('/api/demos');
    list.innerHTML = demos.length
      ? `<div class="grid">${demos.map(demoCard).join('')}</div>`
      : empty('No demos yet', 'Create one, point it at any URL, and drive the browser that opens. Every click becomes a step.', 'Record your first demo');
  } else {
    const shows = await api('/api/showcases');
    list.innerHTML = shows.length
      ? `<div class="grid">${shows.map(showCard).join('')}</div>`
      : empty('No showcases yet', 'A showcase groups demos into one embeddable component: a list of features, each opening an interactive demo with commentary.', 'Create a showcase');
  }
}

const empty = (h, p, cta) =>
  `<div class="empty"><h2>${h}</h2><p>${p}</p><button class="btn btn--primary" id="emptyBtn">${cta}</button></div>`;

const demoCard = (d) => `
  <div class="card">
    <div class="card__thumb">
      ${d.poster ? `<img src="/demos/${esc(d.slug)}/${esc(d.poster)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'none',textContent:'No preview'}))">`
                : '<span class="none">Not recorded yet</span>'}
      <span class="card__badge">${d.steps} step${d.steps === 1 ? '' : 's'}</span>
    </div>
    <div class="card__body">
      <h3>${esc(d.name)}</h3>
      <div class="meta">${esc(d.description || d.startUrl || '—')}</div>
    </div>
    <div class="card__foot">
      <a class="btn btn--sm" href="/editor?demo=${encodeURIComponent(d.slug)}">Edit</a>
      <a class="btn btn--sm" href="/play/${encodeURIComponent(d.slug)}" target="_blank">Play</a>
      <button class="btn btn--sm btn--danger" data-del="${esc(d.slug)}">Delete</button>
    </div>
  </div>`;

const showCard = (s) => `
  <div class="card">
    <div class="card__thumb"><span class="none">${s.features} feature${s.features === 1 ? '' : 's'}</span></div>
    <div class="card__body">
      <h3>${esc(s.name)}</h3>
      <div class="meta">${esc(s.description || '—')}</div>
    </div>
    <div class="card__foot">
      <a class="btn btn--sm" href="/showcase?s=${encodeURIComponent(s.slug)}">Edit</a>
      <button class="btn btn--sm btn--danger" data-delshow="${esc(s.slug)}">Delete</button>
    </div>
  </div>`;

document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('tab--on', t === b));
  render();
});

document.getElementById('list').addEventListener('click', async (e) => {
  const d = e.target.closest('[data-del]');
  if (d) {
    if (!confirm(`Delete "${d.dataset.del}" and all its recorded steps? This cannot be undone.`)) return;
    await api(`/api/demos/${d.dataset.del}`, { method: 'DELETE' });
    toast('Demo deleted');
    return render();
  }
  const s = e.target.closest('[data-delshow]');
  if (s) {
    if (!confirm(`Delete showcase "${s.dataset.delshow}"? The demos it references are kept.`)) return;
    await api(`/api/showcases/${s.dataset.delshow}`, { method: 'DELETE' });
    toast('Showcase deleted');
    return render();
  }
  if (e.target.id === 'emptyBtn') newThing();
});

document.getElementById('newBtn').onclick = newThing;
document.getElementById('aiNewBtn').onclick = aiRecord;

function newThing() {
  if (tab === 'showcases') return newShowcase();
  newDemo();
}

function newDemo() {
  modal({
    title: 'New demo',
    body: `<p>Give it a name and the URL to start recording from. You'll drive the browser yourself.</p>
      <div class="field"><label>Name</label><input class="input" id="mName" placeholder="Runnit dashboard tour" autofocus></div>
      <div class="field"><label>Start URL</label><input class="input" id="mUrl" placeholder="https://app.example.com/dashboard"></div>
      <p class="hint">You can record now or later — the demo is created either way.</p>`,
    confirm: 'Create',
    onConfirm: async (root) => {
      const name = root.querySelector('#mName').value.trim();
      const startUrl = root.querySelector('#mUrl').value.trim();
      if (!name) return toast('A name is required', 'bad');
      const d = await api('/api/demos', { method: 'POST', body: { name, startUrl } });
      location.href = `/editor?demo=${encodeURIComponent(d.slug)}${startUrl ? '&record=1' : ''}`;
    },
  });
}

// Straight from a scenario to a recording: the demo is created behind the scenes, so there is
// nothing to name or set up first. The AI titles it properly when it drafts the story.
function aiRecord() {
  modal({
    title: 'Let AI record a demo',
    body: `<p>Describe what to demonstrate. AI opens the browser, signs in, runs the scenario with realistic
        data and records every action as a step — then writes the story.</p>
      <div class="field"><label>Start URL</label><input class="input" id="aUrl" placeholder="https://app.example.com/dashboard" autofocus></div>
      <div class="field"><label>Scenario to demonstrate</label>
        <textarea class="input" id="aScenario" rows="3" placeholder="Create a new project for a beverage client, add two tasks with due dates, and assign one to a teammate."></textarea></div>
      <div class="field"><label>Docs URL <span class="hint">(optional — AI reads it to follow the intended flow)</span></label>
        <input class="input" id="aDocs" placeholder="https://docs.example.com/getting-started"></div>
      <div class="row">
        <div class="field" style="flex:1"><label>Sign-in email</label><input class="input" id="aEmail" autocomplete="off"></div>
        <div class="field" style="flex:1"><label>Password</label><input class="input" id="aPass" type="password" autocomplete="new-password"></div>
      </div>
      <p class="hint">Credentials are used for this run only — never saved, and sign-in screens are never recorded.</p>`,
    confirm: 'Start AI recording',
    onConfirm: async (root) => {
      const startUrl = root.querySelector('#aUrl').value.trim();
      const scenario = root.querySelector('#aScenario').value.trim();
      // Throwing keeps the modal open with everything typed so far; returning would close it.
      if (!startUrl) throw new Error('A start URL is required');
      if (!scenario) throw new Error('Describe the scenario first');
      const s = await api('/api/capture/auto', {
        method: 'POST',
        body: {
          startUrl,
          scenario,
          docsUrl: root.querySelector('#aDocs').value.trim(),
          email: root.querySelector('#aEmail').value.trim(),
          password: root.querySelector('#aPass').value,
        },
      });
      // Land in the editor already watching, so the steps appear as they are captured.
      location.href = `/editor?demo=${encodeURIComponent(s.slug)}&watch=1`;
    },
  });
}

function newShowcase() {
  modal({
    title: 'New feature showcase',
    body: `<p>Group several demos into one embeddable component.</p>
      <div class="field"><label>Name</label><input class="input" id="sName" placeholder="Why teams choose Runnit" autofocus></div>`,
    confirm: 'Create',
    onConfirm: async (root) => {
      const name = root.querySelector('#sName').value.trim();
      if (!name) return toast('A name is required', 'bad');
      const s = await api('/api/showcases', { method: 'POST', body: { name } });
      location.href = `/showcase?s=${encodeURIComponent(s.slug)}`;
    },
  });
}

// ---------------------------------------------------------------- AI status + first-run setup

const DISMISS_KEY = 'ds.setupDismissed';

function renderAiStatus(s) {
  const el = document.getElementById('aiStatus');
  el.innerHTML = s.configured
    ? `<span class="ai-ok"></span>AI ready · <strong>${esc(s.model)}</strong>`
    : `<button class="linkbtn" id="connectAi">Connect AI</button>`;
  el.querySelector('#connectAi')?.addEventListener('click', () => setupModal());
  // AI recording is the one thing here that cannot work without a key.
  const btn = document.getElementById('aiNewBtn');
  btn.disabled = !s.configured;
  btn.title = s.configured
    ? 'Describe a scenario — AI signs in, runs it and records the demo'
    : 'Connect an API key to let AI record for you';
}

// First launch: offer to connect a key. Skippable — recording and manual editing don't need
// one — and reopenable any time from "Connect AI" in the top bar.
function setupModal({ welcome = false } = {}) {
  modal({
    title: welcome ? 'Welcome' : 'Connect AI',
    cancel: 'Skip for now',
    confirm: 'Connect',
    body: `
      ${welcome ? `<p>Record any web app into an interactive demo, edit it by hand or by talking to
        an AI, and export it as a static bundle you can host anywhere.</p>` : ''}
      <p>Connect an OpenAI or Anthropic API key to unlock the AI layer — auto-drafted
        walkthroughs, the chat copilot, and demos that record themselves. Recording and manual
        editing work without one.</p>
      <div class="field"><label>API key</label>
        <input class="input input--key" id="setupKey" type="password" placeholder="sk-… or sk-ant-…"
               autocomplete="off" spellcheck="false"></div>
      <p class="hint">Paste either one — the key's prefix says which it is. Create an OpenAI key at
        <a href="https://platform.openai.com/api-keys" target="_blank"
        rel="noreferrer">platform.openai.com/api-keys</a>, or an Anthropic key at
        <a href="https://console.anthropic.com/settings/keys" target="_blank"
        rel="noreferrer">console.anthropic.com/settings/keys</a>. It's stored in <code>.env</code>
        on this machine and used only server-side — it never reaches the browser.</p>`,
    onConfirm: async (root) => {
      const key = root.querySelector('#setupKey').value.trim();
      const ok = root.querySelector('[data-ok]');
      ok.disabled = true;
      ok.textContent = 'Verifying…';
      try {
        const s = await api('/api/setup/key', { method: 'POST', body: { key } });
        renderAiStatus(s);
        toast(`AI connected · ${s.model}`, 'good');
      } catch (e) {
        ok.disabled = false;
        ok.textContent = 'Connect';
        throw e;
      }
    },
  });
  localStorage.setItem(DISMISS_KEY, '1');
}

api('/api/ai/status').then((s) => {
  renderAiStatus(s);
  if (!s.configured && !localStorage.getItem(DISMISS_KEY)) setupModal({ welcome: true });
}).catch(() => {});

render();
</script>
</body>
</html>
